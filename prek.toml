default_install_hook_types = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all -- --check"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
entry = "cargo check --workspace --all-targets"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
entry = "cargo test --workspace --all-targets"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-specdrs-check"
name = "cargo specdrs check"
entry = "cargo run --quiet --bin cargo-specdrs -- check"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
