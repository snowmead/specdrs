[package]
name = "specdrs-macros"
version = "0.1.0"
edition = "2024"
description = "Attribute macros for specdrs knowledge maps"
license = "Apache-2.0"

[lib]
proc-macro = true

[dependencies]
specdrs-syntax = { path = "../specdrs-syntax" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

[lints.rust]
unsafe_code = "forbid"
